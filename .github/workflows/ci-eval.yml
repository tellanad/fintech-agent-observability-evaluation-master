name: AI Agent CI + Offline Eval Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  offline-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python 3.13 and install dependencies
        run: |
          uv python install 3.13
          uv sync --locked

      - name: Stage 1 — Fast syntax check ($0, no LLM calls)
        run: |
          uv run python -m py_compile project/fintech_support_agent.py module_b_evaluation/ci_eval_gate.py

      - name: Stage 2 — Offline Evaluation Gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          LANGCHAIN_TRACING_V2: ${{ secrets.LANGCHAIN_API_KEY != '' && 'true' || 'false' }}
          LANGCHAIN_PROJECT: fintech-support-agent-ci
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
          PHOENIX_API_KEY: ${{ secrets.PHOENIX_API_KEY }}
          PHOENIX_COLLECTOR_ENDPOINT: ${{ secrets.PHOENIX_COLLECTOR_ENDPOINT }}
          ARIZE_SPACE_ID: ${{ secrets.ARIZE_SPACE_ID }}
        run: |
          uv run python module_b_evaluation/ci_eval_gate.py
