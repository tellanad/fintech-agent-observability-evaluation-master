[project]
name = "fintech-agent-observability-evaluation"
version = "0.1.0"
description = "Agent Observability, Evaluation & Safety Workshop (LangSmith, DeepEval, Guardrails AI, Presidio)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=0.3.14,<0.4",
    "langchain-community>=0.3.14",
    "langchain-openai>=0.3.1,<0.4",
    "langchain-chroma>=0.2.1,<0.3",
    "langsmith<0.3,>=0.1.17",
    "langgraph>=0.2.60,<0.3",
    "chromadb>=0.6.3,<0.7",
    "openai>=1.59.9,<2",
    "python-dotenv>=1.1.1",
    "tiktoken>=0.8.0",
    "deepeval>=3.8.9",
    "setuptools<81",
    "guardrails-ai @ git+https://github.com/guardrails-ai/guardrails.git@v0.6.0",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "langfuse>=5.2.0",
    "arize-phoenix-otel>=0.17.3",
    "openinference-instrumentation-langchain>=0.1.86",
    "arize>=8.64.0",
]

[tool.uv]
override-dependencies = [
    "lxml>=5.3.0",
]

[tool.pyrefly]
search-path = [".", "project", "module_b_evaluation"]
python-interpreter-path = ".venv/bin/python"

[tool.pyright]
extraPaths = ["project", "module_b_evaluation"]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]


